# ==============================================================================
# TECHX CTF 2026 — COLLEGE LAN / LAPTOP OVERLAY
# ==============================================================================
# In LAN mode:
# - NGINX binds to 0.0.0.0:80 to serve participants over Ethernet switch
# - Offline operation (zero internet access required)
# - Direct HTTP proxy without TLS overhead
# ==============================================================================

services:
  backend:
    environment:
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost,http://127.0.0.1,*}
    volumes:
      - ./data/challenges/static:/data/challenges/static
  nginx:
    ports:
      - "${PUBLIC_PORT:-80}:80"
      - "${ADMIN_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx/nginx.lan.conf:/etc/nginx/nginx.conf:ro
      - ./data/challenges/static:/data/challenges/static:ro
      - ./admin-frontend/dist:/usr/share/nginx/admin-html:ro
    environment:
      - DEPLOYMENT_MODE=lan

