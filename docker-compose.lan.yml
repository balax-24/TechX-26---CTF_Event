# ==============================================================================
# TECHX CTF 2026 — COLLEGE LAN / LAPTOP OVERLAY
# ==============================================================================
# In LAN mode:
# - NGINX binds to 0.0.0.0:80 to serve participants over Ethernet switch
# - Offline operation (zero internet access required)
# - Direct HTTP proxy without TLS overhead
# ==============================================================================

version: '3.8'

services:
  nginx:
    ports:
      - "${PUBLIC_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.lan.conf:/etc/nginx/nginx.conf:ro
    environment:
      - DEPLOYMENT_MODE=lan

  # Expose Postgres port locally on host PC for organizers/diagnostics if needed
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  # Expose Redis port locally on host PC for organizers/diagnostics if needed
  redis:
    ports:
      - "127.0.0.1:6379:6379"
