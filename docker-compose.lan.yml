# ==============================================================================
# TECHX CTF 2026 — COLLEGE LAN / LAPTOP OVERLAY
# ==============================================================================
# In LAN mode:
# - NGINX binds to 0.0.0.0:80 to serve participants over Ethernet switch
# - Offline operation (zero internet access required)
# - Direct HTTP proxy without TLS overhead
# ==============================================================================

services:
  nginx:
    ports:
      - "${PUBLIC_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.lan.conf:/etc/nginx/nginx.conf:ro
    environment:
      - DEPLOYMENT_MODE=lan


