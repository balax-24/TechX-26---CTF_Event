# ==============================================================================
# TECHX CTF 2026 — BASE DOCKER COMPOSE CONFIGURATION
# ==============================================================================
# Usage:
#   College LAN Mode:
#     docker compose -f docker-compose.yml -f docker-compose.lan.yml up -d
#   Production Mode:
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE: PostgreSQL 16 Relational State of Record
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: techx_ctf_postgres
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      POSTGRES_USER: ${DB_USER:-techx_ctf_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-techx_ctf_secure_password_2026}
      POSTGRES_DB: ${DB_NAME:-techx_ctf_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-techx_ctf_user} -d ${DB_NAME:-techx_ctf_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ctf_core_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  # ----------------------------------------------------------------------------
  # 2. CACHE & PUB/SUB: Redis 7 In-Memory Engine
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: techx_ctf_redis
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-techx_redis_secure_password_2026}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-techx_redis_secure_password_2026}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - ctf_core_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ----------------------------------------------------------------------------
  # 3. BACKEND: Fastify TypeScript Core Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: techx_ctf_backend
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - CHALLENGE_GATEWAY_URL=http://challenge_gateway:5000
      - CHALLENGE_GATEWAY_SECRET=${CHALLENGE_GATEWAY_SECRET:-techx_gateway_secure_internal_token_2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      challenge_gateway:
        condition: service_healthy
    volumes:
      - challenge_files:/data/challenges/static
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ctf_core_net
      - ctf_gateway_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  # ----------------------------------------------------------------------------
  # 4. CHALLENGE GATEWAY: Isolated Proxy & Dynamic Infrastructure Manager
  # ----------------------------------------------------------------------------
  challenge_gateway:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: techx_challenge_gateway
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    command: ["node", "dist/modules/dynamic_challenges/gateway_server.js"]
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - GATEWAY_PORT=5000
      - GATEWAY_CONTAINER_NAME=techx_challenge_gateway
      - CHALLENGE_GATEWAY_SECRET=${CHALLENGE_GATEWAY_SECRET:-techx_gateway_secure_internal_token_2026}
      - DOCKER_CONTAINER_CPU_LIMIT=${DOCKER_CONTAINER_CPU_LIMIT:-0.5}
      - DOCKER_CONTAINER_MEMORY_LIMIT=${DOCKER_CONTAINER_MEMORY_LIMIT:-256m}
      - DOCKER_CONTAINER_PIDS_LIMIT=${DOCKER_CONTAINER_PIDS_LIMIT:-64}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ctf_gateway_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ----------------------------------------------------------------------------
  # 5. INGRESS: NGINX Alpine Reverse Proxy
  # ----------------------------------------------------------------------------
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: techx_ctf_nginx
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - challenge_files:/data/challenges/static:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ctf_core_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

# ------------------------------------------------------------------------------
# NETWORKS
# ------------------------------------------------------------------------------
networks:
  ctf_core_net:
    name: techx_ctf_core_net
    driver: bridge
  ctf_gateway_net:
    name: techx_ctf_gateway_net
    driver: bridge
    internal: true

# ------------------------------------------------------------------------------
# PERSISTENT VOLUMES
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: techx_ctf_postgres_data
  redis_data:
    name: techx_ctf_redis_data
  challenge_files:
    name: techx_ctf_challenge_files
