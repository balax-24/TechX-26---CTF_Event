<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechX CTF 2026 — IEEE Technical Event</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0c10;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .badge {
      display: inline-block;
      background: rgba(106, 27, 154, 0.25);
      color: #ba68c8;
      border: 1px solid #6a1b9a;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }
    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    h1 span {
      color: #ba68c8;
    }
    p.subtitle {
      font-size: 1.15rem;
      color: #9e9e9e;
      max-width: 600px;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .card {
      background: #15171e;
      border: 1px solid #2a2b36;
      border-radius: 12px;
      padding: 1.75rem;
      max-width: 500px;
      width: 100%;
      text-align: left;
    }
    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid #222530;
      font-size: 0.95rem;
    }
    .status-item:last-child {
      border-bottom: none;
    }
    .status-label {
      color: #8c8f9f;
    }
    .status-val {
      font-weight: 600;
      color: #4caf50;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4caf50;
    }
  </style>
</head>
<body>
  <div class="badge">IEEE TechX Madras 2026</div>
  <h1>TechX <span>CTF</span> Platform</h1>
  <p class="subtitle">Official Capture The Flag Competition Infrastructure. Platform engine initialization active.</p>

  <div class="card">
    <div class="status-item">
      <span class="status-label">Ingress Gateway</span>
      <span class="status-val"><span class="dot"></span> NGINX Active</span>
    </div>
    <div class="status-item">
      <span class="status-label">Core Backend API</span>
      <span class="status-val"><span class="dot"></span> Fastify Gateway</span>
    </div>
    <div class="status-item">
      <span class="status-label">System Health</span>
      <span class="status-val"><a href="/api/v1/health" style="color: #ba68c8; text-decoration: none;">/api/v1/health &rarr;</a></span>
    </div>
  </div>
</body>
</html>
